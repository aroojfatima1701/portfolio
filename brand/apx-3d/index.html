<title>APX Athletics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Barlow:wght@500;600&display=swap">
<style>
/* Layout: one fixed WebGL stage; a tall scroll spacer drives a camera that dollies down a corridor of brand work, pausing at six stops. HUD is only a progress rail, a scroll cue and a lightbox. */
:root {
  --bg: #060606;
  --lime: #a6ff00;
  --bone: #f1f2ee;
  --graphite: #1a1b19;
  --mute: #7c8374;
  --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { background: var(--bg); }
body {
  color: var(--bone);
  font-family: var(--body);
  overflow-x: hidden;
}
#gl {
  position: fixed; inset: 0; width: 100%; height: 100%;
  display: block; touch-action: pan-y; outline: none;
  background: var(--bg);
}
#scroll { height: 1000vh; min-height: 7000px; }

.vignette {
  position: fixed; inset: 0; pointer-events: none; z-index: 5;
  background: radial-gradient(ellipse at 50% 50%, transparent 52%, rgba(0,0,0,.62) 100%);
}
.hud { position: fixed; z-index: 10; }

.mark {
  top: calc(env(safe-area-inset-top, 0px) + 18px); left: 18px;
  width: 44px; height: 44px; padding: 0; border: 0; background: none; cursor: pointer;
}
.mark img { width: 100%; height: 100%; display: block; object-fit: contain; }

.rail {
  right: 16px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
}
.rail button {
  position: relative; display: flex; align-items: center; justify-content: flex-end; gap: 12px;
  height: 22px; padding: 0 0 0 14px; border: 0; background: none; cursor: pointer; color: var(--mute);
}
.rail button span {
  font: italic 800 15px/1 var(--display); letter-spacing: .14em; text-transform: uppercase;
  opacity: 0; transform: translateX(8px); transition: opacity .25s, transform .25s; pointer-events: none;
}
.rail button i {
  display: block; width: 8px; height: 8px; border-radius: 50%;
  border: 1.5px solid currentColor; transition: all .3s;
}
.rail button:hover span, .rail button:focus-visible span, .rail button.on span { opacity: 1; transform: none; }
.rail button.on { color: var(--lime); }
.rail button.on i { background: var(--lime); height: 22px; border-radius: 4px; border-color: var(--lime); }
.rail button:hover { color: var(--bone); }
.rail button.on:hover { color: var(--lime); }
.rail button:focus-visible, .mark:focus-visible, #lbx:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }

.cue {
  left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  font: 600 11px/1 var(--body); letter-spacing: .42em; text-indent: .42em; color: var(--lime);
  transition: opacity .5s; pointer-events: none;
}
.cue b { display: block; width: 1.5px; height: 44px; background: linear-gradient(var(--lime), transparent); transform-origin: top; animation: drip 1.8s ease-in-out infinite; }
@keyframes drip { 0% { transform: scaleY(0); opacity: 1 } 70% { transform: scaleY(1); opacity: 1 } 100% { transform: scaleY(1); opacity: 0 } }
.cue.gone { opacity: 0; }

#lb {
  position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 24px) 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
  background: rgba(3,3,3,.9); cursor: zoom-out;
}
#lb img { max-width: 100%; max-height: 100%; display: block; box-shadow: 0 0 0 2px var(--lime), 0 30px 90px rgba(0,0,0,.8); }
#lbx {
  position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 18px;
  width: 44px; height: 44px; border: 0; background: none; color: var(--lime); font: 300 38px/1 var(--body); cursor: pointer;
}

#ld {
  position: fixed; inset: 0; z-index: 60; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  transition: opacity .7s .1s, visibility 0s 0.9s;
}
#ld.done { opacity: 0; visibility: hidden; pointer-events: none; }
#ld span { font: italic 900 56px/1 var(--display); letter-spacing: .06em; color: var(--lime); }
#ld i { display: block; width: 120px; height: 2px; background: var(--graphite); overflow: hidden; position: relative; }
#ld i::after { content: ""; position: absolute; inset: 0; background: var(--lime); transform: translateX(-100%); animation: ldbar 1.1s ease-in-out infinite; }
@keyframes ldbar { to { transform: translateX(100%); } }

#fb { display: none; padding: 80px 16px 40px; max-width: 1100px; margin: 0 auto; }
#fb.on { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 16px; }
#fb img { width: 100%; display: block; border: 2px solid var(--lime); }
body.nogl #scroll, body.nogl .rail, body.nogl .cue, body.nogl .vignette, body.nogl #gl { display: none; }

@media (max-width: 560px) {
  .rail { right: 8px; }
  .rail button span { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .cue b { animation: none; transform: none; }
  #ld i::after { animation: none; transform: none; }
}
</style>

    return new THREE.Mesh(new THREE.PlaneGeometry(w, w / aspect), m);
  }
  function layered(tex, w, aspect, n, depth) {
    var g = new THREE.Group(), geo = new THREE.PlaneGeometry(w, w / aspect);
    for (var i = 0; i < n; i++) {
      var t = n === 1 ? 0 : i / (n - 1);
      var f = i === 0 ? 1 : Math.max(0.04, 0.5 * Math.pow(1 - t, 1.5) + 0.05);
      var mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.06, color: new THREE.Color(f, f, f) });
      var mesh = new THREE.Mesh(geo, mat); mesh.position.z = -t * depth; g.add(mesh);
    }
    return g;
  }

  var items = [], pickables = [], K = 1, WK = 1;
  function addItem(g, o) {
    g.position.set(o.x * K, o.y, o.z);
    scene.add(g);
    var it = { g: g, x: o.x, y: o.y, z: o.z, ry: o.ry || 0, bob: reduce ? 0 : (o.bob == null ? 0.1 : o.bob),
      phase: Math.random() * 6.28, hover: 0, fixed: !!o.fixed, upd: o.upd || null, name: o.name || "" };
    items.push(it); return it;
  }

  var limeMat = new THREE.MeshBasicMaterial({ color: 0xa6ff00 });
  function panel(name, x, y, z, ry, w) {
    var a = A[name], tex = T(a.img), h = w * a.h / a.w;
    var g = new THREE.Group();
    var front = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex }));
    front.position.z = 0.04;
    var slab = new THREE.Mesh(new THREE.BoxGeometry(w + 0.1, h + 0.1, 0.06), limeMat);
    g.add(slab); g.add(front);
    var it = addItem(g, { x: x, y: y, z: z, ry: ry, name: name });
    front.userData.item = it; front.userData.name = name; pickables.push(front);
  }

  function layout() {
    var w = window.innerWidth, h = window.innerHeight, asp = w / h;
    renderer.setSize(w, h, false);
    camera.aspect = asp; camera.fov = asp < 1 ? 74 : 55; camera.updateProjectionMatrix();
    K = clamp(asp / 1.5, 0.4, 1); WK = Math.min(1, 0.32 + 0.68 * K);
    items.forEach(function (it) { it.g.position.x = it.x * K; });
  }

  /* ---------- chapter rail ---------- */
  var rail = $("#rail"), dots = [];
  CHAPTERS.forEach(function (n, i) {
    var b = document.createElement("button");
    b.setAttribute("aria-label", n); b.innerHTML = "<span>" + n + "</span><i></i>";
    b.addEventListener("click", function () { goTo(i); });
    rail.appendChild(b); dots.push(b);
  });
  function maxScroll() { return Math.max(1, document.documentElement.scrollHeight - window.innerHeight); }
  function goTo(i) {
    i = clamp(i, 0, CHAPTERS.length - 1);
    window.scrollTo({ top: (i / (CHAPTERS.length - 1)) * maxScroll(), behavior: reduce ? "auto" : "smooth" });
  }
  $("#mark").addEventListener("click", function () { goTo(0); });

  /* ---------- lightbox ---------- */
  var lb = $("#lb"), lbi = $("#lbi");
  function openLb(name) { lbi.src = A[name].src; lbi.alt = A[name].alt; lb.hidden = false; $("#lbx").focus(); }
  function closeLb() { lb.hidden = true; lbi.removeAttribute("src"); }
  lb.addEventListener("click", closeLb);
  window.addEventListener("keydown", function (e) {
    if (!lb.hidden) { if (e.key === "Escape") closeLb(); return; }
    var cur = Math.round(state.idx);
    if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); goTo(cur + 1); }
    if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); goTo(cur - 1); }
  });

  /* ---------- state ---------- */
  var state = { idx: 0, z: STOPS[0], x: 0, y: 0.25, px: 0, py: 0, tpx: 0, tpy: 0, hover: null };
  var ray = new THREE.Raycaster(), ndc = new THREE.Vector2(9, 9);
  window.addEventListener("pointermove", function (e) {
    ndc.x = (e.clientX / window.innerWidth) * 2 - 1; ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
    state.tpx = ndc.x; state.tpy = ndc.y;
  });
  window.addEventListener("click", function (e) {
    if (!lb.hidden || e.target.closest(".rail, .mark")) return;
    ndc.x = (e.clientX / window.innerWidth) * 2 - 1; ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
    ray.setFromCamera(ndc, camera);
    var hit = ray.intersectObjects(pickables, false)[0];
    if (hit) openLb(hit.object.userData.name);
  });
  var cue = $("#cue");
  window.addEventListener("scroll", function () { if (window.scrollY > 40) cue.classList.add("gone"); else cue.classList.remove("gone"); }, { passive: true });
  window.addEventListener("resize", layout);

  var FULL = { w: 1150, h: 765 };
  var dust, dustSpeed, ringA, ringB, coins = [], slabs = [], clock = new THREE.Clock(), started = false;

  function build(texLogo, texIcon, glowInfo) {
    /* hero logo */
    var HW = 7.6, lAsp = FULL.w / FULL.h;
    var hero = new THREE.Group();
    hero.add(layered(texLogo, HW, lAsp, 18, 0.55));
    var glow = plane(glowInfo.tex, HW * glowInfo.k, lAsp, true);
    glow.material.opacity = 0.55; glow.position.z = -0.7; hero.add(glow);
    addItem(hero, { x: 0, y: 0.2, z: -2, bob: 0.08, upd: function (it, t) {
      it.g.rotation.y = Math.sin(t * 0.45) * 0.22 + state.px * 0.28;
      it.g.rotation.x = -state.py * 0.1 + Math.sin(t * 0.3) * 0.03;
    } });

    /* orbit rings */
    var rg = new THREE.TorusGeometry(6.6, 0.02, 8, 200);
    ringA = new THREE.Mesh(rg, limeMat); ringA.position.set(0, 0.2, -3.5); ringA.rotation.x = 1.15; scene.add(ringA);
    ringB = new THREE.Mesh(new THREE.TorusGeometry(8.4, 0.012, 8, 200), new THREE.MeshBasicMaterial({ color: 0x3f6400 }));
    ringB.position.set(0, 0.2, -3.5); ringB.rotation.x = 1.15; ringB.rotation.y = 0.5; scene.add(ringB);

    /* chapter headings */
    [["IDENTITY", 1], ["GEAR", 2], ["CAMPAIGN", 3], ["PALETTE", 4], ["TYPE", 5]].forEach(function (c) {
      var t = textTex(c[0], { size: 320, mode: "stroke" });
      var h = 3.0, w = Math.min(17, h * t.aspect);
      addItem(layered(t.tex, w, w / h, 8, 0.9), { x: 0, y: 3.7, z: STAGE[c[1]] - 8, bob: 0.06, name: c[0] });
    });

    /* panels */
    panel("primary", -3.7, 0.1, -26, 0.28, 5.4);
    panel("guide", 4.0, -0.1, -22, -0.3, 3.5);
    panel("pattern", 0.5, -2.9, -31, -0.08, 4.4);
    panel("tee", -4.3, 0.6, -54, 0.3, 4.6);
    panel("jar", 4.4, 1.0, -57, -0.3, 4.5);
    panel("bottle", -2.4, -0.4, -49, 0.15, 2.0);
    panel("bag", 2.7, -2.3, -52, -0.2, 2.6);
    panel("wrist", -4.0, -2.9, -59, 0.25, 3.3);
    panel("handle", 3.6, -2.7, -61, -0.25, 2.2);
    panel("built", -3.3, 0, -86, 0.3, 3.0);
    panel("nodays", 3.3, 0, -86, -0.3, 3.0);
    panel("phone", 0, 0.3, -90, 0, 2.3);
    panel("banner", 0, -3.3, -92, 0, 10);
    panel("cards", -5.4, 1.2, -98, 0.45, 4.0);
    panel("strips", 5.4, -1.0, -99, -0.4, 5.0);

    /* palette coins */
    var LAB = 'italic 800 64px "Barlow Condensed", Impact, sans-serif', HEX = '600 44px Barlow, system-ui, sans-serif';
    [["Volt Lime", "#A6FF00", 0xa6ff00, 0x3a5200], ["Black", "#000000", 0x000000, 0xa6ff00],
     ["Graphite", "#1A1B19", 0x1a1b19, 0xa6ff00], ["Bone", "#F1F2EE", 0xf1f2ee, 0xa6ff00]].forEach(function (c, i) {
      var g = new THREE.Group();
      var geo = new THREE.CylinderGeometry(1.25, 1.25, 0.36, 72); geo.rotateX(Math.PI / 2);
      var coin = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: c[2], metalness: 0.25, roughness: 0.42 }));
      g.add(coin);
      var rim = new THREE.Mesh(new THREE.TorusGeometry(1.25, 0.028, 10, 90), new THREE.MeshBasicMaterial({ color: i === 0 ? 0xdfffa0 : 0xa6ff00 }));
      rim.position.z = 0.19; g.add(rim);
      var rim2 = rim.clone(); rim2.position.z = -0.19; g.add(rim2);
      var lab = labelTex([{ text: c[0].toUpperCase(), font: LAB, color: "#f1f2ee" }, { text: c[1], font: HEX, color: "#7c8374" }]);
      var lp = plane(lab.tex, 2.2, lab.aspect); lp.position.y = -2.2; g.add(lp);
      var it = addItem(g, { x: -4.5 + i * 3, y: 0.3, z: -112, bob: 0.14, name: c[0], upd: function (it, t) {
        coin.rotation.y = Math.sin(t * 0.6 + i * 1.3) * 0.7 + state.px * 0.2;
        coin.rotation.x = Math.sin(t * 0.4 + i) * 0.12;
        rim.rotation.copy(coin.rotation); rim2.rotation.copy(coin.rotation);
      } });
      coins.push(coin);
    });

    /* type chapter */
    var aa = textTex("Aa", { size: 520, mode: "fill" });
    addItem(layered(aa.tex, 4.6 * aa.aspect, aa.aspect, 10, 0.8), { x: -3.8, y: 0.3, z: -134, ry: 0.25, bob: 0.1, name: "Aa" });
    var apx = textTex("APX ATHLETICS", { size: 300, mode: "stroke" });
    addItem(layered(apx.tex, 8.2, apx.aspect, 8, 0.7), { x: 2.6, y: 1.4, z: -136, ry: -0.2, bob: 0.08, name: "outline" });
    var l1 = labelTex([{ text: "BARLOW CONDENSED", font: LAB, color: "#a6ff00" }, { text: "HEADLINES", font: HEX, color: "#7c8374" }]);
    var p1 = plane(l1.tex, 3.0, l1.aspect); addItem(p1, { x: 0.4, y: -1.4, z: -134, ry: 0.1, bob: 0.05, name: "l1" });
    var l2 = labelTex([{ text: "BARLOW", font: LAB, color: "#f1f2ee" }, { text: "BODY & UI", font: HEX, color: "#7c8374" }]);
    var p2 = plane(l2.tex, 2.4, l2.aspect); addItem(p2, { x: 4.8, y: -1.4, z: -134, ry: -0.1, bob: 0.05, name: "l2" });

    /* finale */
    var fin = new THREE.Group();
    fin.add(layered(texLogo, 7.8, lAsp, 18, 0.6));
    var g2 = plane(glowInfo.tex, 7.8 * glowInfo.k, lAsp, true);
    g2.material.opacity = 0.5; g2.position.z = -0.75; fin.add(g2);
    var hl = labelTex([{ text: "@APXATHLETICS", font: LAB, color: "#a6ff00" }]);
    var hp = plane(hl.tex, 3.2, hl.aspect); hp.position.y = -3.7; fin.add(hp);
    addItem(fin, { x: 0, y: 0.4, z: -156, bob: 0.07, upd: function (it, t) {
      it.g.rotation.y = Math.sin(t * 0.5) * 0.22 + state.px * 0.25;
      it.g.rotation.x = -state.py * 0.08;
    } });

    /* diagonal slabs echo the poster stripe */
    var sgeo = new THREE.BoxGeometry(1, 1, 0.12);
    STAGE.forEach(function (z, i) {
      var s = new THREE.Mesh(sgeo, i % 2 ? limeMat : new THREE.MeshBasicMaterial({ color: 0x5d9200 }));
      s.scale.set(i === 0 ? 17 : 21, i % 2 ? 0.16 : 0.26, 1);
      s.position.set(0, i === 0 ? -3.9 : -4.6, z - 2); s.rotation.z = 0.16; scene.add(s);
      slabs.push({ m: s, z: z, p: i * 1.7 });
    });

    /* floor grid */
    var grid = new THREE.GridHelper(320, 160, 0x2f4a00, 0x142006);
    grid.position.set(0, -5.4, -80); scene.add(grid);

    /* dust */
    var N = 1300, pos = new Float32Array(N * 3); dustSpeed = new Float32Array(N);
    for (var i = 0; i < N; i++) {
      pos[i * 3] = (Math.random() - 0.5) * 30; pos[i * 3 + 1] = Math.random() * 12 - 5.2; pos[i * 3 + 2] = 14 - Math.random() * 185;
      dustSpeed[i] = 0.1 + Math.random() * 0.4;
    }
    var dg = new THREE.BufferGeometry(); dg.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    dust = new THREE.Points(dg, new THREE.PointsMaterial({ color: 0xa6ff00, size: 0.07, transparent: true, opacity: 0.75, depthWrite: false, blending: THREE.AdditiveBlending }));
    scene.add(dust);

    layout();
  }

  function frame() {
    var dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    var p = clamp(window.scrollY / maxScroll(), 0, 1);
    var n = STOPS.length - 1, s = p * n, i = Math.min(n - 1, Math.floor(s)), lt = s - i;
    var e = smooth((lt - 0.16) / 0.68), idx = i + e;
    var tz = lerp(STOPS[i], STOPS[i + 1], e);
    var k = reduce ? 1 : 1 - Math.exp(-dt * 5.5);
    state.z += (tz - state.z) * k; state.idx += (idx - state.idx) * k;
    state.px += (state.tpx - state.px) * (reduce ? 1 : 1 - Math.exp(-dt * 4));
    state.py += (state.tpy - state.py) * (reduce ? 1 : 1 - Math.exp(-dt * 4));
    var tx = Math.sin(state.idx * 1.7) * 0.5 + state.px * 0.35;
    var ty = 0.25 + Math.sin(state.idx * 1.1) * 0.2 + state.py * 0.2;
    camera.position.set(tx, ty, state.z);
    camera.lookAt(tx * 0.4 + state.px * 0.8, 0 + state.py * 0.5, state.z - 10);
    limeLight.position.set(tx, 2, state.z - 6);

    var active = Math.round(state.idx);
    dots.forEach(function (d, j) { d.classList.toggle("on", j === active); });

    ray.setFromCamera(ndc, camera);
    var hit = ray.intersectObjects(pickables, false)[0];
    var hov = hit ? hit.object.userData.item : null;
    $("#gl").style.cursor = hov ? "pointer" : "default";

    items.forEach(function (it) {
      it.hover += ((it === hov ? 1 : 0) - it.hover) * (1 - Math.exp(-dt * 9));
      it.g.position.y = it.y + Math.sin(t * 0.8 + it.phase) * it.bob;
      it.g.rotation.y = it.ry * (1 - it.hover * 0.7) + (reduce ? 0 : Math.sin(t * 0.5 + it.phase) * 0.05);
      it.g.scale.setScalar(WK * (1 + it.hover * 0.08));
      if (it.upd) it.upd(it, t);
    });

    if (!reduce) {
      ringA.rotation.z += dt * 0.12; ringB.rotation.z -= dt * 0.08;
      var arr = dust.geometry.attributes.position.array;
      for (var d = 0; d < dustSpeed.length; d++) {
        arr[d * 3 + 1] += dustSpeed[d] * dt;
        if (arr[d * 3 + 1] > 7) arr[d * 3 + 1] = -5.2;
      }
      dust.geometry.attributes.position.needsUpdate = true;
      slabs.forEach(function (s2) { s2.m.position.x = Math.sin(t * 0.25 + s2.p) * 1.2; });
    }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  function fontsReady() {
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    var p = Promise.all([
      document.fonts.load('italic 900 120px "Barlow Condensed"'),
      document.fonts.load('italic 800 64px "Barlow Condensed"'),
      document.fonts.load('600 44px Barlow')
    ]);
    return Promise.race([p, new Promise(function (r) { setTimeout(r, 2500); })]);
  }

  var names = Object.keys(A);
  Promise.all([
    loadImg(LOGO_FULL), loadImg(LOGO_ICON), fontsReady()
  ].concat(names.map(function (k) { return loadImg(A[k].src).then(function (im) { A[k].img = im; }); })))
  .then(function (r) {
    var full = r[0];
    FULL = { w: full.naturalWidth, h: full.naturalHeight };
    var texLogo = T(svgCanvas(full, 2048));
    var gi = glowCanvas(full, 1024); var glowInfo = { tex: T(gi.canvas), k: gi.k };
    build(texLogo, null, glowInfo);
    started = true; clock.start();
    requestAnimationFrame(frame);
    setTimeout(hideLoader, 250);
  })
  .catch(function () { fallback(); });
})();
</script>
